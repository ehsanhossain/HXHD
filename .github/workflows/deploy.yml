name: Build and deploy to HostSeba

# Deploys hxhdbd.com on every push to main. Manual runs are allowed so a
# deploy can be re-triggered without an empty commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

# A second push while one deploy is mid-upload would interleave files on the
# server. Queue instead, and never cancel a run that is already writing.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # This host answers FTP commands slowly for GitHub runners: measured at
    # ~15 files/min, so the ~326-file sync needs roughly 25 minutes.

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # the dependency-drift guard diffs against HEAD~1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # react-day-picker@8 declares peers of React ≤18 while the project is on
      # React 19, so a plain `npm ci` fails to resolve.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      # Assembles ./deploy: standalone server + .next/static + public, minus
      # build-only packages. Fails loudly if a required piece is missing.
      - name: Assemble deploy bundle
        run: npm run package

      # Passenger reloads the app when this file's mtime changes. Shipping it
      # as part of the sync is what makes the new code actually take effect.
      - name: Stamp restart trigger
        run: |
          mkdir -p deploy/tmp
          date -u +"restart requested %Y-%m-%dT%H:%M:%SZ" > deploy/tmp/restart.txt

      # The FTP sync skips node_modules, so a lockfile change would deploy new
      # application code against the old dependency tree. Stop rather than ship
      # that; dependencies need a full sync (scripts/README: npm run deploy:ftp).
      - name: Guard against dependency drift
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1 && \
             ! git diff --quiet HEAD~1 HEAD -- package-lock.json package.json; then
            echo "::error::package.json or package-lock.json changed. node_modules is not part of the automated sync — run a full deploy manually, then re-run this workflow."
            exit 1
          fi
          echo "dependencies unchanged — safe to sync application files only"

      - name: Deploy over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          # Pure-FTPd on this host accepts the control connection but the data
          # channel stalls from GitHub's runners — without a timeout the step
          # hangs for the full job limit having written nothing. Fail fast and
          # print the handshake so the cause is visible in the log.
          timeout: 60000
          log-level: verbose
          # The action keeps a manifest on the server and uploads only what
          # changed, so the first deploy is slow and later ones are quick.
          state-name: .ftp-deploy-sync-state.json
          # Never let a stray local artefact reach production.
          #
          # node_modules is excluded deliberately. It is 1843 of the bundle's
          # 2169 files and 330 of its 369 directories, and the first two runs
          # spent their entire job limit issuing CWD/MKD/CDUP through it
          # without uploading anything — this host answers FTP commands from
          # GitHub's runners orders of magnitude slower than from a local
          # connection. The dependencies are already on the server and only
          # change when the lockfile does, which the guard step below catches.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/*.map

      - name: Summary
        run: |
          echo "### Deployed to hxhdbd.com" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Passenger restarts on the new \`tmp/restart.txt\`; first request after that recompiles." >> "$GITHUB_STEP_SUMMARY"

  # Runs after the deploy and fails the run if the live site is not healthy,
  # so a broken release is visible in the Actions tab rather than discovered
  # by a visitor.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Passenger to come back
        run: sleep 45

      - name: Check every page responds
        run: |
          fail=0
          for path in "" products services industries knowledge contact; do
            url="https://hxhdbd.com/$path"
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 "$url" || echo 000)
            printf '%-46s %s\n' "$url" "$code"
            [ "$code" = "200" ] || fail=1
          done
          exit $fail

      - name: Check a product detail page
        run: |
          # Read the slug from the catalogue instead of pinning one. A pinned
          # slug turns into a false failure the moment that product is renamed
          # or dropped -- which is what happened when the waterproof range was
          # reconciled against the model sheet.
          # Scoped to PRODUCTS: the categories array sits first in the file
          # and its slugs are not valid /products/<slug> URLs.
          slug=$(sed -n '/export const PRODUCTS/,$p' src/data/products.ts | grep -o '"slug": "[^"]*"' | head -1 | cut -d'"' -f4)
          if [ -z "$slug" ]; then echo "could not read a product slug"; exit 1; fi
          echo "checking slug: $slug"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 "https://hxhdbd.com/products/$slug" || echo 000)
          echo "detail -> $code"
          [ "$code" = "200" ]

      - name: Check CSS actually loaded
        run: |
          # A site whose .next/static did not sync still returns 200 but has no
          # stylesheet — catch that specifically.
          css=$(curl -s --max-time 45 https://hxhdbd.com/ | grep -o '/_next/static/css/[^"]*\.css' | head -1)
          if [ -z "$css" ]; then echo "no stylesheet referenced"; exit 1; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 "https://hxhdbd.com$css")
          echo "stylesheet $css -> $code"
          [ "$code" = "200" ]
